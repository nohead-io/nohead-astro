name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      # Also builds dist/ (prepare).
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      # The package as users get it: what it contains, and that it imports.
      - name: Pack, and import it as a site does
        run: |
          npm pack --silent
          dir=$(mktemp -d)
          (cd "$dir" && npm init -y >/dev/null && npm install --silent "$GITHUB_WORKSPACE"/nohead-astro-*.tgz astro &&
            node --input-type=module -e 'await import("@nohead/astro"); await import("@nohead/astro/image-service")')
      # The lockfile holds the oldest @nohead/sdk the package takes (its
      # dependency range starts there); sites get the newest in the range, so
      # the types and tests run against that too.
      - name: Types and tests with the newest @nohead/sdk
        run: |
          npm install --no-save --no-audit --no-fund "@nohead/sdk@$(node -p 'require("./package.json").dependencies["@nohead/sdk"]')"
          npm ls @nohead/sdk
          npm run typecheck
          npm test

  # The one check main's ruleset requires, so the required checks don't change
  # when the jobs do.
  ci-success:
    name: CI passed
    if: always()
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "$RESULTS" | jq -e 'all(. == "success")'
